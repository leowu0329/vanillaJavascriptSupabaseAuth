<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase 認證系統</title>

  <!-- Google Fonts: Noto Sans TC & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Roboto', 'Noto Sans TC', sans-serif;
      background-color: #f8f9fa;
      min-height: 100vh;
    }

    .centered-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      background: #ffffff;
      border-radius: 0.75rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }

    /* 側邊欄整體樣式修復 */
    .sidebar-wrapper {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #212529;
      color: #fff;
      transition: width 0.3s ease;
      overflow-x: hidden;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
    }

    .sidebar.collapsed {
      width: 70px;
    }

    /* 頂部標題與縮放按鈕區域 */
    .sidebar .sidebar-header {
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .sidebar.collapsed .sidebar-header {
      justify-content: center;
      padding: 0.75rem 0;
    }

    /* 隱藏文字與調整連結對齊 */
    .sidebar .link-text {
      margin-left: 0.75rem;
      transition: opacity 0.2s ease;
      display: inline-block;
    }

    .sidebar.collapsed .link-text {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    .sidebar .nav-link {
      color: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      padding: 0.75rem 1.25rem;
      height: 48px;
    }

    .sidebar.collapsed .nav-link {
      padding: 0.75rem 0;
      justify-content: center;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      color: #fff;
      background-color: #0d6efd;
    }

    .sidebar .nav-link i {
      font-size: 1.25rem;
      width: 30px;
      text-align: center;
      flex-shrink: 0;
    }

    .sidebar .link-text {
      margin-left: 0.75rem;
      transition: opacity 0.2s ease;
    }

    .sidebar.collapsed .link-text {
      opacity: 0;
      pointer-events: none;
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <!-- 全域 Bootstrap Alert Modal -->
  <div class="modal fade" id="globalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="globalModalTitle">系統提示</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="globalModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">確定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 全域 登出確認 Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">操作確認</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="confirmModalBody">確定要執行此操作嗎？</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-danger" id="confirmModalActionBtn">確定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 入口腳本 -->
  <script type="module" src="./src/assets/js/app.js"></script>
</body>

</html>
